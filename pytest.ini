[pytest]
testpaths = tests

# `actions/test_action.py` is a demo fixture for the autonomous self-patching
# engine: it deliberately raises ZeroDivisionError when no `scale` is supplied
# so the live self-repair flow has something real to find. It is not a unit test,
# and pytest collecting it under the default `test_*.py` glob turns that
# intentional bug into a red suite.
# Restrict collection to the real suite in `tests/` (see `testpaths` above).
norecursedirs = actions core memory brahma_connect brahma-connect-android assets
                 config dashboard features installer plugins smart_home .git
                 __pycache__ .pytest_cache